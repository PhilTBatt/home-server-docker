services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      WEBUI_PORT: 8081
      TORRENTING_PORT: 6881
    volumes:
      - ./config/qbittorrent:/config
      - /home/phil/media/downloads/torrents:/data/downloads/torrents
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"