services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    environment:
      TZ: Europe/London
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file:
      - ./homepage/.env
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ./homepage/config:/app/config

  kuma:
    image: louislam/uptime-kuma:2
    container_name: kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      TZ: Europe/London
    volumes:
      - ./kuma/data:/app/data

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Europe/London
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./hub:/srv/hub:ro

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "8096:8096"
    environment:
      TZ: Europe/London
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /home/phil/media/library:/media
    group_add:
      - "991"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      WEBUI_PORT: 8081
      TORRENTING_PORT: 6881
    volumes:
      - ./media-stack/config/qbittorrent:/config
      - /home/phil/media/downloads/torrents:/data/downloads/torrents
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - ./media-stack/config/prowlarr:/config
    ports:
      - "9696:9696"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - ./media-stack/config/sonarr:/config
      - /home/phil/media:/data
    ports:
      - "8989:8989"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - ./media-stack/config/radarr:/config
      - /home/phil/media:/data
    ports:
      - "7878:7878"

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    environment:
      TZ: Europe/London

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      TZ: Europe/London
      LOG_LEVEL: info
    volumes:
      - ./media-stack/config/seerr:/app/config
    ports:
      - "5055:5055"

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: Europe/London
      APP_URL: http://192.168.0.200:8090
    volumes:
      - ./beszel/data:/beszel_data
      - ./beszel/socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./beszel/.env
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
    volumes:
      - ./beszel/agent_data:/var/lib/beszel-agent
      - ./beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build: ./api
    container_name: api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      TZ: Europe/London
    volumes:
      - /var/log/wifi-watchdog:/var/log/wifi-watchdog:ro
      - /var/lib/home-hub:/var/lib/home-hub:ro
      - type: bind
        source: ../hub-memory/inbox
        target: /memory/inbox
        bind:
          create_host_path: false
      - type: bind
        source: ./deals
        target: /deals
        bind:
          create_host_path: false
    networks:
      - default
      - jarvis
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Authorization: Bearer $$API_TOKEN\" http://127.0.0.1:3000/health"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  mcp:
    build: ./mcp
    profiles:
      - tools

  jarvis:
    image: node:26-alpine
    profiles:
      - jarvis
    user: node
    working_dir: /app
    command: npm run chat
    env_file:
      - ./jarvis/.env
    volumes:
      - ./jarvis:/app
      - ./mcp:/mcp:ro
      - type: bind
        source: ../hub-memory
        target: /brain
        read_only: true
        bind:
          create_host_path: false
    networks:
      - jarvis

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0@sha256:f54c5960c2b9387f6349080a9944f8bc7e8cdb98a4ef9238cb0b0f9ff9795f44
    container_name: kokoro
    profiles:
      - kokoro
    environment:
      DEFAULT_VOICE: bm_george
      HF_HUB_DISABLE_TELEMETRY: "1"
      ENABLE_WEB_PLAYER: "false"
    mem_limit: 2g
    networks:
      - speech
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8880/health"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 2s

networks:
  jarvis:
  speech:
    internal: true