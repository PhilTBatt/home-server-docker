services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: Europe/London
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    env_file:
      - ./homepage/.env
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ./homepage/config:/app/config

  kuma:
    image: louislam/uptime-kuma:2
    container_name: kuma
    restart: unless-stopped
    environment:
      TZ: Europe/London
    volumes:
      - ./kuma/data:/app/data

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Europe/London
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./hub:/srv/hub:ro

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "8096:8096"
    environment:
      TZ: Europe/London
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /home/phil/media/library:/media
    group_add:
      - "991"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      WEBUI_PORT: 8081
      TORRENTING_PORT: 6881
    volumes:
      - ./media-stack/config/qbittorrent:/config
      - /home/phil/media/downloads/torrents:/data/downloads/torrents
    ports:
      - "6881:6881"
      - "6881:6881/udp"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - ./media-stack/config/prowlarr:/config

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - ./media-stack/config/sonarr:/config
      - /home/phil/media:/data

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
    volumes:
      - ./media-stack/config/radarr:/config
      - /home/phil/media:/data

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    environment:
      TZ: Europe/London

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      TZ: Europe/London
      LOG_LEVEL: info
    volumes:
      - ./media-stack/config/seerr:/app/config

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      TZ: Europe/London
      APP_URL: http://metrics.home
    volumes:
      - ./beszel/data:/beszel_data
      - ./beszel/socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2@sha256:343254226ae57a5cc6f8c23c755b1464730aba2abc7043116a2e222711ec6e1a
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./beszel/.env
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
    volumes:
      - ./beszel/agent_data:/var/lib/beszel-agent
      - ./beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build: ./api
    container_name: api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      TZ: Europe/London
    volumes:
      - /var/log/wifi-watchdog:/var/log/wifi-watchdog:ro
      - /var/lib/home-hub:/var/lib/home-hub:ro
      - type: bind
        source: ../hub-memory/inbox
        target: /memory/inbox
        bind:
          create_host_path: false
      - type: bind
        source: ./deals
        target: /deals
        bind:
          create_host_path: false
      - type: bind
        source: ./expiry
        target: /expiry
        bind:
          create_host_path: false
      - type: bind
        source: ./api/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./chores/requests
        target: /chores/requests
        bind:
          create_host_path: false
      - type: bind
        source: ./chores/results
        target: /chores/results
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./spotify
        target: /spotify
        bind:
          create_host_path: false
      - type: bind
        source: ./projector
        target: /projector
        bind:
          create_host_path: false
    networks:
      - default
      - jarvis
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Authorization: Bearer $$API_TOKEN\" http://127.0.0.1:3000/health"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  mcp:
    build: ./mcp
    profiles:
      - tools

  jarvis:
    image: node:26-alpine
    profiles:
      - jarvis
    user: node
    working_dir: /app
    command: npm run chat
    env_file:
      - ./jarvis/.env
    volumes:
      - ./jarvis:/app
      - ./mcp:/mcp:ro
      - type: bind
        source: ../hub-memory
        target: /brain
        read_only: true
        bind:
          create_host_path: false
    networks:
      - jarvis

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0@sha256:f54c5960c2b9387f6349080a9944f8bc7e8cdb98a4ef9238cb0b0f9ff9795f44
    container_name: kokoro
    profiles:
      - kokoro
    environment:
      DEFAULT_VOICE: bm_george
      HF_HUB_DISABLE_TELEMETRY: "1"
      ENABLE_WEB_PLAYER: "false"
      API_LOG_LEVEL: ERROR
    mem_limit: 2g
    networks:
      - speech
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8880/health"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 2s

  piper:
    image: rhasspy/wyoming-piper:2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
    container_name: piper
    profiles:
      - piper
    command: ["--voice", "${PIPER_VOICE:-en_GB-alan-medium}"]
    volumes:
      - type: bind
        source: ./piper/voices
        target: /data
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 1g
    networks:
      - speech
    healthcheck:
      test: ["CMD", "/usr/src/.venv/bin/python3", "-m", "wyoming_piper.health_check"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 2s

  ears:
    build: ./ears
    container_name: ears
    profiles:
      - ears
    env_file:
      - ./ears/.env
    volumes:
      - type: bind
        source: ./ears/switch
        target: /switch
        read_only: true
        bind:
          create_host_path: false
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    networks:
      - ears
    depends_on:
      whisper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/dist/ask.js", "health"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  whisper:
    image: rhasspy/wyoming-whisper:3.8.1@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
    container_name: whisper
    profiles:
      - ears
    user: "10300:10300"
    init: true
    command: ["--model", "/models/base-int8", "--stt-library", "faster-whisper", "--language", "en", "--local-files-only"]
    environment:
      PYTHONPATH: /quiet
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ./whisper/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./whisper/sitecustomize.py
        target: /quiet/sitecustomize.py
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    mem_limit: 1g
    networks:
      - ears
    healthcheck:
      test: ["CMD", "/usr/src/.venv/bin/python3", "-m", "wyoming_faster_whisper.health_check"]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 2m
      start_interval: 2s

  openwakeword:
    image: rhasspy/wyoming-openwakeword:2.1.0@sha256:52cb1168731a1849fc28cf339c935fde58746bbabc94226668a40ef6ddf5d42b
    container_name: openwakeword
    profiles:
      - wake
    user: "10400:10400"
    init: true
    command: ["--threshold", "${WAKE_THRESHOLD:-0.5}"]
    volumes:
      - type: bind
        source: ./openwakeword/health.py
        target: /health/health.py
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    mem_limit: 256m
    networks:
      - ears
    healthcheck:
      test: ["CMD", "/usr/src/.venv/bin/python3", "/health/health.py"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
      start_interval: 2s

networks:
  jarvis:
  speech:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  ears:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated