<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Hub</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <h1>Home Hub</h1>
    <p id="message">Loading...</p>

    <form id="login-form" hidden>
      <label for="token">Token</label>
      <input id="token" type="password" required>
      <button type="submit">Log in</button>
    </form>

    <section id="dashboard" hidden>
      <h2>Alerts</h2>
      <ul id="alerts">
        <li>Loading...</li>
      </ul>

      <h2>Downloads</h2>
      <ul id="downloads">
        <li>Loading...</li>
      </ul>

      <h2>Library</h2>
      <p id="library">Loading...</p>
      <button id="scan-library" type="button">Scan library</button>

      <h2>Wi-Fi</h2>
      <p id="wifi">Loading...</p>

      <div id="brain" hidden>
        <h2>Brain</h2>
        <p id="brain-inbox" hidden>Loading...</p>
        <form id="note-form" hidden>
          <label for="note-title">Title</label>
          <input id="note-title" maxlength="80" required>
          <label for="note-text">Note</label>
          <textarea id="note-text" maxlength="20000" rows="6" required></textarea>
          <button id="send-note" type="submit">Send to the brain</button>
        </form>
        <p id="note-status"></p>
      </div>

      <div id="deals" hidden>
        <h2>Deals</h2>
        <p id="deals-status">Loading...</p>
        <div id="deals-list"></div>
        <ul id="deals-searches"></ul>
        <button id="check-deals" type="button">Check now</button>
      </div>

      
      <h2>Server</h2>
      <p id="server">Loading...</p>

      <h2>Backups</h2>
      <p id="backup">Loading...</p>

      <h2>Switches</h2>
      <p id="switches">Loading...</p>
      
      <button id="logout" type="button">Log out</button>
    </section>
  </body>
</html>
