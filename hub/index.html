<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Hub</title>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <h1>Home Hub</h1>
    <p id="message">Loading...</p>

    <form id="login-form" hidden>
      <label for="token">Token</label>
      <input id="token" type="password" required>
      <button type="submit">Log in</button>
    </form>

    <h2>Downloads</h2>
    <ul id="downloads">
      <li>Loading...</li>
    </ul>

    <h2>Library</h2>
    <p id="library">Loading...</p>
    <button id="scan-library" type="button">Scan library</button>

    <h2>Wi-Fi</h2>
    <p id="wifi">Loading...</p>

    <section id="dashboard" hidden>
      <button id="logout" type="button">Log out</button>
    </section>
  </body>
</html>
