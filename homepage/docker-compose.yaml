services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file:
      - .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.200:8080,100.64.238.6:8080,home-server:8080,home-server.tail8209fb.ts.net:8080
      PUID: 1000
      PGID: 1000
    volumes:
      - ./config:/app/config
