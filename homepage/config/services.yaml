- Infrastructure:
  - AdGuard Home:
      icon: adguard-home.png
      href: http://dns.home
      description: DNS filtering
      widget:
        type: adguard
        url: http://adguard:3000
        username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
        password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

  - Uptime Kuma:
      icon: uptime-kuma.png
      href: http://uptime.home
      description: Service monitoring
      widget:
        type: uptimekuma
        url: http://kuma:3001
        slug: home

  - Beszel:
      icon: beszel.png
      href: http://metrics.home
      description: System Metrics
      widget:
        type: beszel
        url: http://beszel:8090
        username: "{{HOMEPAGE_VAR_BESZEL_USERNAME}}"
        password: "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}"
        systemId: home-server
        version: 2

- Media:
  - Jellyfin:
      icon: jellyfin.png
      href: http://jellyfin.home
      description: Media server
      widget:
        type: jellyfin
        url: http://jellyfin:8096
        key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
        enableBlocks: true
        enableNowPlaying: true

  - Seerr:
      icon: seerr.png
      href: http://requests.home
      description: Media Requests
      widget:
        type: seerr
        url: http://seerr:5055
        key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
        enableBlocks: true
        enableNowPlaying: true

  - Sonarr:
      icon: sonarr.png
      href: http://sonarr.home
      description: TV
      widget:
        type: sonarr
        url: http://sonarr:8989
        key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        enableBlocks: true
        enableNowPlaying: true

  - Radarr:
      icon: radarr.png
      href: http://radarr.home
      description: Movies
      widget:
        type: radarr
        url: http://radarr:7878
        key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        enableBlocks: true
        enableNowPlaying: true

  - Prowlarr:
      icon: prowlarr.png
      href: http://prowlarr.home
      description: Indexers
      widget:
        type: prowlarr
        url: http://prowlarr:9696
        key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        enableBlocks: true
        enableNowPlaying: true

  - qBittorrent:
      icon: qbittorrent.png
      href: http://qbit.home
      description: BitTorrent client
      widget:
        type: qbittorrent
        url: http://qbittorrent:8081
        username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
        password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"

  - Byparr:
      icon: mdi-shield-check
      href: http://192.168.0.200:8191
      description: Cloudflare Solver