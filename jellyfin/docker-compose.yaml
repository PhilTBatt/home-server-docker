services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /home/phil/media:/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      TZ: Europe/London